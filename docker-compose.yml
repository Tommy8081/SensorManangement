version: "3.8"

services:
  # 前端服务（生产环境）
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pure-admin-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务（开发环境）
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pure-admin-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.pnpm-store
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - dev

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
